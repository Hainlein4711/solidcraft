# Fork-only instrumentation; the product checkout stays on the PR commit below.
name: CI diagnostics (swap, single compiler)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-diagnostics-${{ github.ref }}
  cancel-in-progress: false

env:
  TESTED_SHA: ebc27832c4597d863dd8c693842e3f9282f6e711
  CARGO_BUILD_JOBS: "1"
  DIAGNOSTIC_SWAP_GIB: "12"
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always

jobs:
  diagnose:
    name: Diagnose ${{ matrix.phase }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        phase: [solidcore-archive, native-archive, native-tests]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ebc27832c4597d863dd8c693842e3f9282f6e711
          persist-credentials: false
      - name: Verify the exact product commit
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$TESTED_SHA"
          test -z "$(git status --porcelain)"
          echo "Product SHA: $(git rev-parse HEAD)"
          echo "Compiler jobs: $CARGO_BUILD_JOBS"
      - name: Configure and verify diagnostic swap
        shell: bash
        env:
          DIAGNOSTIC_PHASE: ${{ matrix.phase }}
        run: |
          set -Eeuo pipefail
          diag_dir="$RUNNER_TEMP/ci-diagnostics-$DIAGNOSTIC_PHASE"
          mkdir -p "$diag_dir"
          {
            echo "Resources before configuring swap"
            free -m
            df -B1 "$GITHUB_WORKSPACE" "$RUNNER_TEMP"
            swap_file="$RUNNER_TEMP/solidcraft-ci.swap"
            test ! -e "$swap_file"
            swap_bytes=$((DIAGNOSTIC_SWAP_GIB * 1024 * 1024 * 1024))
            sudo fallocate -l "$swap_bytes" "$swap_file"
            sudo chmod 600 "$swap_file"
            sudo mkswap "$swap_file"
            sudo swapon "$swap_file"
            sudo swapon --show --bytes --noheadings --raw --output NAME,SIZE | awk -v file="$swap_file" -v minimum="$((swap_bytes - 4096))" \
              '$1 == file && $2 >= minimum { found = 1 } END { exit !found }'
            awk -v minimum="$((DIAGNOSTIC_SWAP_GIB * 1024 * 1024 - 4))" \
              '$1 == "SwapTotal:" && $2 >= minimum { found = 1 } END { exit !found }' /proc/meminfo
            echo "Resources after configuring swap"
            free -m
            swapon --show --bytes
            df -B1 "$GITHUB_WORKSPACE" "$RUNNER_TEMP"
            printf 'Additional swap: %s GiB; verified active\n' "$DIAGNOSTIC_SWAP_GIB"
          } 2>&1 | tee "$diag_dir/swap-setup.log"
          printf 'Additional swap: %s GiB; verified active\n' "$DIAGNOSTIC_SWAP_GIB" >> "$GITHUB_STEP_SUMMARY"
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          key: ${{ matrix.phase == 'solidcore-archive' && 'solidcore-tests' || 'native-tests' }}
          workspaces: ${{ matrix.phase == 'solidcore-archive' && 'solidcore -> bin' || '. -> target' }}
          save-if: false
      - name: Native compiler cache (same wrapper as the original jobs)
        id: sccache
        if: matrix.phase != 'solidcore-archive'
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba
        continue-on-error: true
        with:
          version: v0.16.0
      - name: Configure the native compiler wrapper
        if: matrix.phase != 'solidcore-archive'
        shell: bash
        env:
          CACHE_OUTCOME: ${{ steps.sccache.outcome }}
        run: |
          if [ "$CACHE_OUTCOME" = success ]; then
            echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"
          else
            echo "RUSTC_WRAPPER=" >> "$GITHUB_ENV"
          fi
          echo "SCCACHE_DIR=/home/runner/.cache/sccache" >> "$GITHUB_ENV"
          echo "SCCACHE_CACHE_SIZE=20G" >> "$GITHUB_ENV"
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8
        with:
          tool: ${{ matrix.phase == 'solidcore-archive' && 'cargo-nextest@0.9.150' || 'cargo-nextest@0.9.148' }}
      - name: Native test software Vulkan driver
        if: matrix.phase == 'native-tests'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mesa-vulkan-drivers libvulkan1
      - name: Diagnose the original command with one compiler
        shell: bash
        env:
          DIAGNOSTIC_PHASE: ${{ matrix.phase }}
        run: |
          set -Eeuo pipefail
          test "$CARGO_BUILD_JOBS" = 1
          awk -v minimum="$((DIAGNOSTIC_SWAP_GIB * 1024 * 1024 - 4))" \
            '$1 == "SwapTotal:" && $2 >= minimum { found = 1 } END { exit !found }' /proc/meminfo
          source_dir="$PWD"
          diag_dir="$RUNNER_TEMP/ci-diagnostics-$DIAGNOSTIC_PHASE"
          mkdir -p "$diag_dir"
          cat > "$diag_dir/monitor.py" <<'PY_MONITOR'
          import argparse
          import csv
          import datetime
          import json
          import os
          from pathlib import Path
          import shutil
          import signal
          import subprocess
          import threading
          import time


          def read(path):
              try:
                  return path.read_text().strip()
              except (OSError, UnicodeError):
                  return ''


          def number(value):
              try:
                  return int(value)
              except (TypeError, ValueError):
                  return None


          def memory_info(proc):
              result = {}
              for line in read(proc / 'meminfo').splitlines():
                  key, _, value = line.partition(':')
                  fields = value.split()
                  if fields:
                      result[key] = number(fields[0])
              return result


          def cgroup_path(proc):
              groups = [line.split(':', 2) for line in read(proc / 'self/cgroup').splitlines()]
              for line in read(proc / 'self/mountinfo').splitlines():
                  before, sep, after = line.partition(' - ')
                  fields, extra = before.split(), after.split()
                  if not sep or len(fields) < 5 or len(extra) < 3:
                      continue
                  version = 2 if extra[0] == 'cgroup2' else 1 if extra[0] == 'cgroup' and 'memory' in extra[2].split(',') else 0
                  if not version:
                      continue
                  root = Path(fields[3].replace('\\040', ' '))
                  mount = Path(fields[4].replace('\\040', ' '))
                  for group in groups:
                      if len(group) != 3 or not (version == 2 and group[0] == '0' or version == 1 and 'memory' in group[1].split(',')):
                          continue
                      path = Path(group[2])
                      try:
                          relative = path.relative_to(root)
                      except ValueError:
                          continue
                      if '..' in relative.parts:
                          continue
                      candidate = mount / relative
                      filename = 'memory.current' if version == 2 else 'memory.usage_in_bytes'
                      if (candidate / filename).exists():
                          return version, candidate
              return 0, None


          def cgroup_metrics(version, path):
              if path is None:
                  return {}
              names = {'current': 'memory.current', 'peak': 'memory.peak', 'max': 'memory.max', 'swap': 'memory.swap.current'} if version == 2 else {
                  'current': 'memory.usage_in_bytes', 'peak': 'memory.max_usage_in_bytes', 'max': 'memory.limit_in_bytes', 'swap': 'memory.memsw.usage_in_bytes'}
              result = {'cgroup_' + key + '_bytes': number(read(path / name)) for key, name in names.items()}
              if version == 1:
                  combined, current = result['cgroup_swap_bytes'], result['cgroup_current_bytes']
                  result['cgroup_swap_bytes'] = max(0, combined - current) if combined is not None and current is not None else None
              events = {}
              filename = 'memory.events' if version == 2 else 'memory.oom_control'
              for line in read(path / filename).splitlines():
                  fields = line.split()
                  if len(fields) == 2:
                      events[fields[0]] = number(fields[1])
              result.update(cgroup_oom=events.get('oom'), cgroup_oom_kill=events.get('oom_kill'))
              return result


          def cpu_ticks(proc):
              for line in read(proc / 'stat').splitlines():
                  if line.startswith('cpu '):
                      values = [number(v) for v in line.split()[1:9]]
                      if len(values) >= 5 and all(v is not None for v in values):
                          return sum(values), values[3] + values[4]
              return None


          def load_average(proc):
              try:
                  values = [float(v) for v in read(proc / 'loadavg').split()[:3]]
                  return dict(zip(['load_1m', 'load_5m', 'load_15m'], values))
              except ValueError:
                  return {}


          def processes():
              try:
                  output = subprocess.check_output(['ps', '-eo', 'pid,ppid,rss,comm', '--sort=-rss'], text=True, stderr=subprocess.DEVNULL)
              except (OSError, subprocess.SubprocessError):
                  return None, None, ''
              rows = [line.split(None, 3) for line in output.splitlines()[1:]]
              rustc = [row for row in rows if len(row) == 4 and row[3] == 'rustc']
              return len(rustc), sum(int(row[2]) for row in rustc), '\n'.join(output.splitlines()[:9])


          def main():
              parser = argparse.ArgumentParser()
              parser.add_argument('--source', required=True)
              parser.add_argument('--out', required=True)
              parser.add_argument('--interval', type=float, default=15)
              parser.add_argument('--samples', type=int, default=0)
              parser.add_argument('--proc', default='/proc')
              args = parser.parse_args()
              destination = Path(args.out)
              destination.mkdir(parents=True, exist_ok=True)
              proc = Path(args.proc)
              version, group = cgroup_path(proc)
              initial = cgroup_metrics(version, group)
              stop = threading.Event()
              for sig in [signal.SIGTERM, signal.SIGINT]:
                  signal.signal(sig, lambda *_: stop.set())
              print(json.dumps({'cgroup_version': version, 'cgroup_path': str(group) if group else None, 'oom_baseline': initial,
                                'cargo_build_jobs': os.environ.get('CARGO_BUILD_JOBS'), 'interval_seconds': args.interval}), flush=True)
              count = 0
              summary = {'minimum_mem_available_kb': None, 'minimum_disk_free_bytes': None, 'maximum_rustc_rss_kb': None}
              fields = ['utc', 'elapsed_seconds', 'cpu_busy_percent', 'load_1m', 'load_5m', 'load_15m', 'mem_total_kb', 'mem_available_kb', 'swap_total_kb', 'swap_free_kb', 'disk_total_bytes',
                        'disk_free_bytes', 'rustc_processes', 'rustc_rss_kb', 'cgroup_current_bytes', 'cgroup_peak_bytes', 'cgroup_max_bytes',
                        'cgroup_swap_bytes', 'cgroup_oom', 'cgroup_oom_kill', 'cgroup_oom_delta', 'cgroup_oom_kill_delta']
              start = time.monotonic()
              previous_cpu = cpu_ticks(proc)
              with (destination / 'resources.csv').open('w', newline='') as handle:
                  writer = csv.DictWriter(handle, fieldnames=fields)
                  writer.writeheader()
                  while True:
                      mem = memory_info(proc)
                      disk = shutil.disk_usage(args.source)
                      rustc_count, rustc_rss, top = processes()
                      cg = cgroup_metrics(version, group)
                      cpu = cpu_ticks(proc)
                      busy = None
                      if cpu is not None and previous_cpu is not None:
                          total_delta = cpu[0] - previous_cpu[0]
                          idle_delta = cpu[1] - previous_cpu[1]
                          if total_delta > 0:
                              busy = round(100 * (total_delta - idle_delta) / total_delta, 2)
                      previous_cpu = cpu
                      row = {'utc': datetime.datetime.now(datetime.timezone.utc).isoformat(), 'elapsed_seconds': round(time.monotonic() - start, 1),
                             'cpu_busy_percent': busy, **load_average(proc),
                             'mem_total_kb': mem.get('MemTotal'), 'mem_available_kb': mem.get('MemAvailable'), 'swap_total_kb': mem.get('SwapTotal'),
                             'swap_free_kb': mem.get('SwapFree'), 'disk_total_bytes': disk.total, 'disk_free_bytes': disk.free,
                             'rustc_processes': rustc_count, 'rustc_rss_kb': rustc_rss, **cg}
                      for event in ['oom', 'oom_kill']:
                          key = 'cgroup_' + event
                          row[key + '_delta'] = cg[key] - initial[key] if cg.get(key) is not None and initial.get(key) is not None else None
                      writer.writerow(row)
                      handle.flush()
                      print('RESOURCE ' + json.dumps(row), flush=True)
                      if count % 4 == 0 and top:
                          print('TOP_RSS_KB\n' + top, flush=True)
                      for key, value, operation in [('minimum_mem_available_kb', row['mem_available_kb'], min),
                                                     ('minimum_disk_free_bytes', disk.free, min), ('maximum_rustc_rss_kb', rustc_rss, max)]:
                          if value is not None:
                              summary[key] = value if summary[key] is None else operation(summary[key], value)
                      count += 1
                      summary.update(samples=count, last_sample=row, cgroup_version=version, cgroup_path=str(group) if group else None)
                      (destination / 'summary.json').write_text(json.dumps(summary, indent=2))
                      if stop.is_set() or args.samples and count >= args.samples:
                          break
                      stop.wait(max(0.01, args.interval))


          if __name__ == '__main__':
              main()
          PY_MONITOR
          monitor_pid=
          finish() {
            result=$?
            trap - EXIT
            set +e
            if [ -n "$monitor_pid" ]; then
              kill -TERM "$monitor_pid" 2>/dev/null
              wait "$monitor_pid"
              monitor_result=$?
              printf '%s\n' "$monitor_result" > "$diag_dir/monitor-exit.txt"
            fi
            printf '%s\n' "$result" > "$diag_dir/command-exit.txt"
            echo "::group::Final machine resources"
            free -m
            df -h "$source_dir" "$RUNNER_TEMP"
            git -C "$source_dir" diff --stat
            echo "::endgroup::"
            {
              echo "### $DIAGNOSTIC_PHASE"
              echo "Product commit: $TESTED_SHA"
              echo "Cargo build jobs: $CARGO_BUILD_JOBS; command exit: $result"
              echo "Test profiles and nextest runtime parallelism match the original commands."
              echo 'Resource CSV, JSON summary, RSS samples and command timing are in the diagnostic artifact.'
            } >> "$GITHUB_STEP_SUMMARY"
            exit "$result"
          }
          trap finish EXIT
          trap 'exit 143' TERM
          trap 'exit 130' INT
          python3 -u "$diag_dir/monitor.py" --source "$source_dir" --out "$diag_dir" --interval 15 > >(tee "$diag_dir/resources.log") 2>&1 &
          monitor_pid=$!
          sleep 1
          kill -0 "$monitor_pid"
          test -s "$diag_dir/resources.csv"
          printf 'Product SHA: %s\nCompiler jobs: %s\nPhase: %s\n' "$TESTED_SHA" "$CARGO_BUILD_JOBS" "$DIAGNOSTIC_PHASE" | tee "$diag_dir/config.txt"
          cargo --version
          rustc --version
          cargo nextest --version
          case "$DIAGNOSTIC_PHASE" in
            solidcore-archive)
              cd solidcore
              /usr/bin/time -v -o "$diag_dir/command-time.txt" cargo nextest archive --workspace --cargo-profile goldens --archive-file tests.tar.zst
              ;;
            native-archive)
              /usr/bin/time -v -o "$diag_dir/command-time.txt" cargo nextest archive --workspace --cargo-profile ci --locked --archive-file tests.tar.zst
              ;;
            native-tests)
              export SOLIDCRAFT_GPU=software SOLIDCRAFT_REQUIRE_GPU=1 VIEWPORT_TEST_GPU=software VIEWPORT_TEST_REQUIRE_GPU=1
              export ACTION_MATRIX_JOBS=12
              base='not (package(solidcraft-kernel) & binary(boolean_props))'
              junit=${CARGO_TARGET_DIR:-target}/nextest/ci/junit.xml
              rm -f "$junit"
              status=0
              /usr/bin/time -v -o "$diag_dir/command-time.txt" cargo nextest run --workspace --cargo-profile ci --locked --profile ci --no-tests=pass \
                --ignore-default-filter -E "($base) & not (package(=solidcraft-gpu) & test(/^path::/))" || status=$?
              if [ "$status" -ne 0 ] && [ "$status" -ne 100 ]; then exit "$status"; fi
              cargo xtask known-failing --junit "$junit"
              cli="${CARGO_TARGET_DIR:-target}/ci/solidcraft-cli"
              cargo xtask i18n --check --cli "$cli"
              ;;
            *) echo "Unknown diagnostic phase" >&2; exit 2 ;;
          esac
      - name: Retain resource diagnostics even when the command fails
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: diagnostics-${{ matrix.phase }}
          path: ${{ runner.temp }}/ci-diagnostics-${{ matrix.phase }}/
          retention-days: 7
          if-no-files-found: warn
